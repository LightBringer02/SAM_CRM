# Render.com deployment configuration
# https://render.com/docs/yaml-spec

services:
  - type: web
    name: final-crm
    env: node
    buildCommand: npm run postinstall && cd frontend && npm install && npm run build
    startCommand: node backend/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_SSL
        value: true

databases:
  - name: crm-database
    databaseName: samcrm
    user: postgres
